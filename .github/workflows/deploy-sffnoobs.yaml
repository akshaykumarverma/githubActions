name: Deploy to sffnoobs environment on push to masterBranch

on:
  push:
    branches:
      - masterBranch
    paths:
      - 'force-app/**'
      - '.github/workflows/**'

jobs:
  Deploy-to-sffnoobs-environment:
    runs-on: ubuntu-latest
    environment: sffnoobs

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          # Need full history so sfdx-git-delta can compare commits
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install sfdx git delta
        run: |
          echo Y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      - name: Create delta packages
        env:
          GIT_PREV_SHA: ${{ github.event.before }}
          GIT_NEW_SHA: ${{ github.sha }}
        run: |
          mkdir -p changed-sources

          echo "Previous SHA: $GIT_PREV_SHA"
          echo "Current  SHA: $GIT_NEW_SHA"

          # If this is the first commit on the branch, github.event.before can be all zeros.
          # In that case, just use the current commit as both from/to to avoid failure.
          if [ "$GIT_PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "First push on this branch. Using current SHA for both from/to."
            GIT_PREV_SHA=$GIT_NEW_SHA
          fi

          sf sgd source delta \
            --from "$GIT_PREV_SHA" \
            --to "$GIT_NEW_SHA" \
            --output-dir "changed-sources" \
            --generate-delta \
            --source-dir "force-app"

          echo "[INFO] Diff generated. Delta contents:"
          ls -R changed-sources || echo "Delta is empty"

      - name: Deploy to environment with running all local tests
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key

          sf org login jwt \
            --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --instance-url ${{ vars.INSTANCE_URL }} \
            --set-default

          if [ -d "changed-sources/force-app" ] && [ "$(ls -A changed-sources/force-app)" ]; then
            echo "Changes found in delta. Starting deployment..."
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --test-level RunLocalTests \
              --verbose
          else
            echo "No metadata changes found in delta (NothingToDeploy). Skipping deployment."
          fi
