name: Validate Salesforce Metadata

on:
  push:
    branches: [ masterBranch ]
    paths:
      - 'force-app/**'

jobs:
  validate:
      runs-on: ubuntu-latest
      
      steps:
        - uses: actions/setup-node@v3
          with:
            node-version: '18'

        - name: Checkout source code
          uses: actions/checkout@v3
          with:
            fetch-depth: 2

        - name: Install Salesforce CLI
          run: npm install @salesforce/cli --global

        - name: Install sfdx-git-delta
          run: echo Y | sfdx plugins:install sfdx-git-delta

        - name: Create delta packages
          run: |
            mkdir changed-sources
            sf sgd source delta --to "HEAD" --from "HEAD~1" \
               --output changed-sources/ --generate-delta --source force-app/

        - name: Authenticate to Salesforce
          run: |
            echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
            sf org login jwt \
              --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
              --jwt-key-file server.key \
              --client-id ${{ secrets.CONSUMER_KEY }} \
              --instance-url ${{ vars.INSTANCE_URL }} \
              --set-default

        - name: Validate only (No Deployment)
          run: |
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --test-level RunLocalTests \
              --dry-run \
              --verbose
